<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Event-driven architecture — animated</title>
  <style>
    :root {
      --paper: #f0eee6;
      --panel: #f8f6f0;
      --panel-2: #f3f0e7;
      --ink: #1f1e1d;
      --muted: #55524c;
      --stone: #8c877c;
      --line: #ded8c9;
      --line-soft: #e8e3d6;
      --accent: #d97757;
      --accent-soft: #f6e3da;

      --added: #4f7f52;
      --added-soft: #e7efe3;
      --done: #3d6f96;
      --done-soft: #e4ecf2;
      --amber: #a8763a;
      --teal: #2f7f78;
      --red: #b5493d;

      /* chrome heights in design px; fit() shrinks these when the window is
       shorter than 16:10 so the stage keeps room */
      --barH: 58px;
      --conH: 96px;
      --narH: 92px;

      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper)
    }

    body {
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* One fixed 960-unit-wide canvas, scaled so it fills the window edge to edge
     like a slide. fit() sets the height in design units (innerHeight / K), so
     there are no letterbox gutters either. At 1440x900 that is exactly 1.5x and
     600 design px tall — the "browser zoomed to 150%" look. */
    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .app {
      width: 960px;
      height: 600px;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      transform-origin: center center;
      transform: scale(1);
    }

    /* ---------------- top bar ---------------- */
    .bar {
      flex: 0 0 auto;
      height: var(--barH);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0
    }

    .brand .file {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--stone);
      white-space: nowrap;
    }

    .brand h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 20px;
      margin: 0;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .brand h1 em {
      font-style: italic;
      color: var(--accent)
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto
    }

    .dots button {
      width: 8px;
      height: 8px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--stone);
      background: transparent;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .dots button:hover {
      transform: scale(1.4)
    }

    .dots button.done {
      background: var(--stone);
      border-color: var(--stone)
    }

    .dots button.on {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.3)
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .controls button {
      font: inherit;
      font-size: 11px;
      letter-spacing: .02em;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      transition: background .15s, border-color .15s;
    }

    .controls button:hover {
      background: #e7e2d5;
      border-color: var(--stone)
    }

    .controls button.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #f6f3ea;
      min-width: 62px
    }

    .controls button.primary:hover {
      background: #33312e
    }

    .controls button:disabled {
      opacity: .32;
      cursor: default
    }

    .controls select {
      font: inherit;
      font-family: var(--mono);
      font-size: 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: var(--ink);
      padding: 4px 2px;
      cursor: pointer;
    }

    .progress {
      height: 2px;
      background: var(--line-soft);
      flex: 0 0 auto
    }

    .progress i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .35s ease
    }

    /* ---------------- stage ---------------- */
    .stage {
      position: relative;
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 196px 34px minmax(0, 1fr) 52px 220px;
      padding: 14px 18px 12px;
      align-items: stretch;
      min-height: 0;
      overflow: hidden;
    }

    #wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0
    }

    .stage>section {
      position: relative;
      z-index: 1;
      min-height: 0
    }

    .col-1 {
      grid-column: 1
    }

    .col-3 {
      grid-column: 3
    }

    .col-5 {
      grid-column: 5
    }

    /* ---------------- cards ---------------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 11px 12px 10px;
      box-shadow: 0 1px 0 rgba(31, 30, 29, .03);
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .cardhead {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 9px;
      flex: 0 0 auto
    }

    .cardhead .num {
      font-family: var(--mono);
      font-size: 9px;
      color: #fff;
      background: var(--ink);
      width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      border-radius: 3px;
      flex: 0 0 auto;
      align-self: center;
    }

    .cardhead .kind {
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--stone);
    }

    .cardhead .name {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* publisher */
    .rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1 1 auto;
      min-height: 0
    }

    .row {
      position: relative;
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      padding: 7px 11px 7px 9px;
      background: #fbfaf6;
      transition: background .3s, border-color .3s, box-shadow .3s;
      opacity: .55;
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .row .call {
      font-family: var(--mono);
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--muted)
    }

    .row .call b {
      display: block;
      color: var(--ink);
      font-weight: 600;
      font-size: 11px
    }

    .row .call b::after {
      content: "()";
      color: var(--stone);
      font-weight: 400
    }

    .row .port {
      position: absolute;
      right: -5px;
      top: 50%;
      margin-top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--line);
      transition: border-color .3s, background .3s;
    }

    .row.fired {
      opacity: 1;
      background: #fdfcf8;
      border-color: var(--line)
    }

    .row.fired.added .port {
      border-color: var(--added);
      background: var(--added)
    }

    .row.fired.done .port {
      border-color: var(--done);
      background: var(--done)
    }

    .row.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft)
    }

    /* bus */
    .registry {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      flex: 0 0 auto
    }

    .regevent {
      display: flex;
      align-items: flex-start;
      gap: 8px
    }

    .regevent .en {
      font-family: var(--mono);
      font-size: 10px;
      padding-top: 3px;
      width: 86px;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .regevent .en.added {
      color: var(--added)
    }

    .regevent .en.done {
      color: var(--done)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 20px;
      flex: 1 1 auto
    }

    .chip {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #fbfaf6;
      color: var(--muted);
      transition: background .25s, color .25s, border-color .25s, transform .25s, opacity .35s;
      white-space: nowrap;
    }

    .chip.hot {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #8d452c;
      transform: translateY(-1px);
    }

    .chip.strike {
      opacity: 0;
      transform: translateY(3px) scale(.9);
      text-decoration: line-through
    }

    .slot {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #f5f2e9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color .3s, background .3s, box-shadow .3s;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
    }

    .slot .empty {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--stone);
      letter-spacing: .04em;
    }

    .slot.pop {
      animation: slotPop .42s cubic-bezier(.2, 1.4, .4, 1) both
    }

    @keyframes slotPop {
      from {
        opacity: .25;
        transform: scale(.965)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .slot.added {
      border-color: var(--added);
      background: var(--added-soft)
    }

    .slot.done {
      border-color: var(--done);
      background: var(--done-soft)
    }

    .evhead {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 4px
    }

    .evhead .kick {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .16em;
      color: var(--stone);
      text-transform: uppercase;
    }

    .evhead .type {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600
    }

    .slot.added .evhead .type {
      color: var(--added)
    }

    .slot.done .evhead .type {
      color: var(--done)
    }

    .evhead .count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--stone);
      white-space: nowrap
    }

    .evbody {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      word-break: break-word
    }

    .evbody b {
      color: var(--ink);
      font-weight: 600
    }

    /* subscribers */
    .subs {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .sub {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 8px 10px 8px 14px;
      overflow: hidden;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: opacity .4s, border-color .3s, background .3s, box-shadow .3s;
    }

    .sub::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--bar, var(--stone));
      transition: opacity .4s;
    }

    .sub .port {
      position: absolute;
      left: -5px;
      top: 50%;
      margin-top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--line);
    }

    .subhead {
      display: flex;
      align-items: baseline;
      gap: 7px
    }

    .subhead .hname {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink)
    }

    .subhead .runs {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--stone)
    }

    .listens {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .05em;
      color: var(--stone);
      margin: 2px 0 4px;
      text-transform: uppercase;
    }

    .out {
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.4;
      color: var(--stone);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      transition: color .3s;
    }

    .out.live {
      color: var(--ink)
    }

    .sub.called {
      background: #fdfbf5;
      box-shadow: 0 0 0 3px rgba(217, 119, 87, .14);
      border-color: #e7cdbf;
    }

    .sub.off {
      opacity: .42;
      background: var(--panel-2)
    }

    .sub.off .out {
      text-decoration: line-through;
      text-decoration-color: var(--red)
    }

    .sub.off .subhead .hname {
      text-decoration: line-through;
      text-decoration-color: var(--red)
    }

    /* short windows: same type, less chrome inside the cards */
    .tight .subs {
      gap: 6px
    }

    .tight .sub {
      padding: 6px 9px 6px 13px
    }

    .tight .listens {
      margin: 1px 0 3px
    }

    .tight .row {
      padding: 5px 9px 5px 8px
    }

    .tight .slot {
      padding: 8px 10px
    }

    .vtight .listens {
      display: none
    }

    .vtight .out {
      -webkit-line-clamp: 1
    }

    .vtight .subs {
      gap: 4px
    }

    .vtight .sub {
      padding: 4px 8px 4px 12px
    }

    .vtight .row .call {
      font-size: 9.5px
    }

    .vtight .rows {
      gap: 5px
    }

    /* ---------------- console strip ---------------- */
    .console {
      flex: 0 0 auto;
      height: var(--conH);
      display: flex;
      gap: 12px;
      padding: 8px 18px 10px;
      border-top: 1px solid var(--line);
      min-height: 0;
    }

    .conhead {
      flex: 0 0 76px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 3px;
    }

    .conhead .t {
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--stone);
    }

    .conhead .cmd {
      font-family: var(--mono);
      font-size: 8px;
      line-height: 1.45;
      color: var(--stone);
      opacity: .85;
    }

    .conbody {
      flex: 1 1 auto;
      min-width: 0;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      line-height: 1.55;
      background: #23211e;
      border-radius: 7px;
      padding: 8px 11px;
      color: #c9c3b4;
      scrollbar-width: thin;
    }

    .conbody::-webkit-scrollbar {
      width: 6px
    }

    .conbody::-webkit-scrollbar-thumb {
      background: #4a463f;
      border-radius: 3px
    }

    .ln {
      display: flex;
      gap: 8px;
      animation: lnIn .22s ease both
    }

    @keyframes lnIn {
      from {
        opacity: 0;
        transform: translateY(2px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .ln .tag {
      flex: 0 0 auto;
      width: 58px;
      text-align: right;
      opacity: .95
    }

    .ln .msg {
      flex: 1 1 auto;
      word-break: break-word;
      color: #ded8ca
    }

    .ln.event .tag {
      color: #8f8776
    }

    .ln.event .msg {
      color: #f3efe4;
      font-weight: 600
    }

    .ln.bus .tag {
      color: #9a9384
    }

    .ln.bus .msg {
      color: #b9b2a2;
      font-style: italic
    }

    .ln.log .tag {
      color: #8fb6d6
    }

    .ln.notify .tag {
      color: #9dc08f
    }

    .ln.rewards .tag {
      color: #e0b271
    }

    .ln.analytics .tag {
      color: #7fc4bb
    }

    .ln.blank {
      height: 5px
    }

    /* ---------------- history overlay ---------------- */
    .histOverlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      background: rgba(240, 238, 230, .95);
    }

    .histOverlay.open {
      display: grid;
      animation: fadeIn .35s ease both
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .histPanel {
      width: 604px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 18px 12px;
      box-shadow: 0 12px 30px rgba(31, 30, 29, .07);
    }

    .histPanel h4 {
      margin: 0;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--stone);
      font-weight: 400;
    }

    .histPanel .sub2 {
      margin: 2px 0 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .histPanel table {
      border-collapse: collapse;
      width: 100%;
      font-family: var(--mono);
      font-size: 10.5px
    }

    .histPanel tr {
      border-top: 1px solid var(--line-soft);
      animation: lnIn .3s ease both
    }

    .histPanel tr:first-child {
      border-top: 0
    }

    .histPanel td {
      padding: 4px 0;
      color: var(--muted);
      vertical-align: top;
      white-space: nowrap
    }

    .histPanel td.t {
      color: var(--stone);
      width: 62px
    }

    .histPanel td.e {
      width: 112px;
      font-weight: 600
    }

    .histPanel td.e.added {
      color: var(--added)
    }

    .histPanel td.e.done {
      color: var(--done)
    }

    .histPanel td.d {
      white-space: normal;
      color: var(--stone);
      padding-left: 10px
    }

    /* ---------------- narration ---------------- */
    .narration {
      flex: 0 0 auto;
      min-height: var(--narH);
      border-top: 1px solid var(--line);
      padding: 10px 18px 12px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .narration .stepno {
      font-family: var(--serif);
      font-size: 27px;
      line-height: 1;
      color: var(--accent);
      width: 40px;
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
    }

    .narration .nartext {
      flex: 1 1 auto;
      min-width: 0
    }

    .narration p {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.42;
      color: var(--ink);
      max-width: 74ch;
    }

    .narration code {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      background: #e9e5d9;
      border-radius: 4px;
      padding: 3px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .narration .legend {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: var(--mono);
      font-size: 8.5px;
      color: var(--stone);
      letter-spacing: .04em;
      text-align: right;
      padding-top: 2px;
    }

    .narration .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
      justify-content: flex-end
    }

    .narration .legend i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block
    }
  </style>
</head>

<body>
  <div class="viewport">
    <div class="app" id="app">

      <header class="bar">
        <div class="brand">
          <span class="file">events_demo.py</span>
          <h1>One fact, <em>many reactions</em></h1>
        </div>

        <div class="dots" id="dots"></div>

        <div class="controls">
          <button id="btnPlay" class="primary">Play</button>
          <button id="btnBack">&#8592; Back</button>
          <button id="btnNext">Next &#8594;</button>
          <button id="btnRestart">Restart</button>
          <select id="speed" title="speed">
            <option value="0.5">0.5&times;</option>
            <option value="1" selected>1&times;</option>
            <option value="1.6">1.6&times;</option>
            <option value="2.4">2.4&times;</option>
          </select>
        </div>
      </header>
      <div class="progress"><i id="bar"></i></div>

      <main class="stage" id="stage">
        <svg id="wires" xmlns="http://www.w3.org/2000/svg">
          <g id="gStatic"></g>
          <g id="gPulse"></g>
        </svg>

        <!-- 2. publisher -->
        <section class="card col-1" id="pubCard">
          <div class="cardhead">
            <span class="num">2</span><span class="kind">Publisher</span>
            <span class="name">TaskStore</span>
          </div>
          <div class="rows" id="rows"></div>
        </section>

        <!-- 4. bus -->
        <section class="card bus col-3" id="busCard">
          <div class="cardhead">
            <span class="num">4</span><span class="kind">Event bus</span>
            <span class="name">EventBus</span>
          </div>
          <div class="registry" id="registry"></div>
          <div class="slot" id="slot">
            <div class="empty">awaiting event&hellip;</div>
          </div>
        </section>

        <!-- 3. subscribers -->
        <section class="subs col-5" id="subs"></section>

        <!-- history, shown over the stage at the end -->
        <div class="histOverlay" id="histOverlay">
          <div class="histPanel">
            <h4>bus.history</h4>
            <p class="sub2">every event this run published</p>
            <div id="histRows"></div>
          </div>
        </div>
      </main>

      <section class="console">
        <div class="conhead">
          <span class="t">output</span>
          <span class="cmd">uv run python<br>events_demo.py</span>
        </div>
        <div class="conbody" id="conbody"></div>
      </section>

      <footer class="narration">
        <div class="stepno" id="stepno">01</div>
        <div class="nartext">
          <p id="narrationText"></p>
          <code id="snippet"></code>
        </div>
        <div class="legend">
          <span><i style="background:var(--added)"></i>TaskAdded</span>
          <span><i style="background:var(--done)"></i>TaskCompleted</span>
          <span><i style="background:var(--accent)"></i>bus activity</span>
        </div>
      </footer>
    </div>
  </div>

  <script>
    "use strict";

    /* ============================================================================
       A scripted animation of one run of events_demo.py, drawn on a fixed
       960x600 canvas that is scaled to fill the window (1.5x at 1440x900).
       Scenes are cumulative: to show scene i, scenes 0..i-1 are applied instantly
       and then scene i is animated — so Back / jump-to-dot is deterministic.
       ========================================================================== */

    const $ = (sel) => document.querySelector(sel);
    const app = $("#app");
    const stage = $("#stage");
    const svg = $("#wires");
    const gStatic = $("#gStatic");
    const gPulse = $("#gPulse");
    const NS = "http://www.w3.org/2000/svg";

    const DESIGN_W = 960;
    const DESIGN_H = 600;
    const ABORT = Symbol("abort");

    let K = 1;                        // canvas -> screen scale
    const S = { paused: false, speed: 1, playing: false };
    let runId = 0;

    /* ------------------------------------------------------------------ data */

    const SUBS = [
      { handler: "log_event", listens: ["TaskAdded", "TaskCompleted"], colour: "var(--done)", hex: "#3d6f96" },
      { handler: "celebrate_added", listens: ["TaskAdded"], colour: "var(--added)", hex: "#4f7f52" },
      { handler: "award_points", listens: ["TaskCompleted"], colour: "var(--amber)", hex: "#a8763a" },
      { handler: "record_analytics", listens: ["TaskCompleted"], colour: "var(--teal)", hex: "#2f7f78" }
    ];

    const WIRING = [
      ["TaskAdded", "log_event"],
      ["TaskCompleted", "log_event"],
      ["TaskAdded", "celebrate_added"],
      ["TaskCompleted", "award_points"],
      ["TaskCompleted", "record_analytics"]
    ];

    const ROWS = [
      { fn: "add_task", args: '"Write the report", 2', type: "TaskAdded" },
      { fn: "add_task", args: '"Water the plants"', type: "TaskAdded" },
      { fn: "complete_task", args: '"Write the report", 25', type: "TaskCompleted" },
      { fn: "complete_task", args: '"Water the plants", 5', type: "TaskCompleted" }
    ];

    const EV = {
      added: { cls: "added", colour: "#4f7f52" },
      done: { cls: "done", colour: "#3d6f96" }
    };

    /* event clock: fixed, so a replay reads identically */
    let clock = 9 * 3600 + 41 * 60 + 2;
    function nextStamp() {
      const t = clock;
      clock += 7;
      const h = String(Math.floor(t / 3600)).padStart(2, "0");
      const m = String(Math.floor(t / 60) % 60).padStart(2, "0");
      const s = String(t % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function payload(ev) {
      if (ev.type === "TaskAdded")
        return `title=<b>'${ev.title}'</b>  priority=<b>${ev.priority}</b>`;
      return `title=<b>'${ev.title}'</b>  minutes_spent=<b>${ev.minutes_spent}</b>`;
    }
    function plainPayload(ev) {
      if (ev.type === "TaskAdded")
        return `title='${ev.title}'  priority=${ev.priority}`;
      return `title='${ev.title}'  minutes_spent=${ev.minutes_spent}`;
    }

    /* --------------------------------------------------------------- state */

    let state;

    function freshState() {
      return {
        subs: { TaskAdded: [], TaskCompleted: [] },
        removed: new Set(),
        fired: [false, false, false, false],
        activeRow: -1,
        runs: {},
        lines: [],
        history: [],
        event: null
      };
    }

    /* -------------------------------------------------------------- render */

    function renderRows() {
      $("#rows").innerHTML = ROWS.map((r, i) => {
        const cls = [
          "row",
          r.type === "TaskAdded" ? "added" : "done",
          state.fired[i] ? "fired" : "",
          state.activeRow === i ? "active" : ""
        ].join(" ");
        return `
      <div class="${cls}" id="row${i}" title="${r.type}">
        <div class="call"><b>${r.fn}</b><span>(${r.args})</span></div>
        <span class="port"></span>
      </div>`;
      }).join("");
    }

    function renderRegistry() {
      $("#registry").innerHTML = ["TaskAdded", "TaskCompleted"].map(type => {
        const cls = type === "TaskAdded" ? "added" : "done";
        const chips = state.subs[type].map(h =>
          `<span class="chip" id="chip-${type}-${h}">${h}</span>`
        ).join("");
        return `
      <div class="regevent">
        <span class="en ${cls}">${type}</span>
        <span class="chips">${chips}</span>
      </div>`;
      }).join("");
      drawWires();
    }

    function renderSubs() {
      SUBS.forEach(s => {
        const card = document.getElementById("sub-" + s.handler);
        if (!card) return;
        card.querySelector(".runs").textContent = "×" + (state.runs[s.handler] || 0);
        card.classList.toggle("off", state.removed.has(s.handler));
        if (state.removed.has(s.handler)) {
          const out = card.querySelector(".out");
          out.classList.remove("live");
          out.textContent = "unsubscribed — not called";
        }
      });
    }

    function logLine(kind, text) {
      state.lines.push({ kind, text });
      renderConsole();
    }

    function renderConsole() {
      const body = $("#conbody");
      body.innerHTML = state.lines.map(l => {
        if (l.kind === "blank") return `<div class="ln blank"></div>`;
        return `<div class="ln ${l.kind}"><span class="tag">${l.kind}</span><span class="msg">${l.text}</span></div>`;
      }).join("");
      body.scrollTop = body.scrollHeight;
    }

    function renderHistory() {
      const rows = state.history.map(ev => {
        const cls = ev.type === "TaskAdded" ? "added" : "done";
        return `<tr>
      <td class="t">${ev.stamp}</td>
      <td class="e ${cls}">${ev.type}</td>
      <td class="d">${plainPayload(ev)}</td>
    </tr>`;
      }).join("");
      $("#histRows").innerHTML = `<table>${rows}</table>`;
    }

    /* ---------------------------------------------------------------- wires */

    const wires = { row: [], sub: {} };

    /* Element edges in canvas coordinates (rects come back in screen px, so
       divide out the window scale K). */
    function rectIn(el) {
      const r = el.getBoundingClientRect();
      const s = stage.getBoundingClientRect();
      return {
        x1: (r.left - s.left) / K,
        x2: (r.right - s.left) / K,
        cy: (r.top - s.top) / K + r.height / (2 * K)
      };
    }

    function curve(a, b) {
      const dx = Math.max(22, Math.abs(b.x - a.x) * 0.55);
      return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
    }

    /* A wire that runs out to a shared vertical rail, along it, then across to
       the target. Pulses therefore travel a readable distance instead of the
       20px of empty gap between two cards. */
    function trunk(a, b, railX) {
      const inx = Math.max(10, Math.abs(railX - a.x) * 0.9);
      const outx = Math.max(10, Math.abs(b.x - railX) * 0.6);
      return `M ${a.x} ${a.y} `
        + `C ${a.x + inx} ${a.y}, ${railX - 8} ${a.y}, ${railX} ${a.y} `
        + `L ${railX} ${b.y} `
        + `C ${railX + 8} ${b.y}, ${b.x - outx} ${b.y}, ${b.x} ${b.y}`;
    }

    function makePath(d) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "#d6d0c0");
      p.setAttribute("stroke-width", "1.3");
      p.setAttribute("stroke-dasharray", "2 4");
      p.setAttribute("stroke-linecap", "round");
      gStatic.appendChild(p);
      return p;
    }

    function drawWires() {
      gStatic.innerHTML = "";
      wires.row = [];
      wires.sub = {};

      const s = stage.getBoundingClientRect();
      const W = s.width / K;
      const H = s.height / K;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      const slot = $("#slot");
      const sr = rectIn(slot);
      const left = { x: sr.x1, y: sr.cy };
      const right = { x: sr.x2, y: sr.cy };

      // rails sit in the middle of the empty columns either side of the bus
      const pubRight = rectIn($("#pubCard")).x2;
      const busLeft = rectIn($("#busCard")).x1;
      const busRight = rectIn($("#busCard")).x2;
      const subLeft = rectIn($("#subs")).x1;
      const leftRail = (pubRight + busLeft) / 2;
      const rightRail = (busRight + subLeft) / 2;

      ROWS.forEach((_, i) => {
        const row = document.getElementById("row" + i);
        if (!row) return;
        const pr = rectIn(row.querySelector(".port"));
        wires.row[i] = makePath(trunk({ x: pr.x2, y: pr.cy }, left, leftRail));
      });

      SUBS.forEach(sub => {
        const card = document.getElementById("sub-" + sub.handler);
        if (!card) return;
        const pr = rectIn(card.querySelector(".port"));
        const p = makePath(trunk(right, { x: pr.x1, y: pr.cy }, rightRail));
        if (state && state.removed.has(sub.handler)) {
          p.setAttribute("stroke", "#ddc9c1");
          p.setAttribute("stroke-dasharray", "1 6");
          p.setAttribute("opacity", ".75");
        }
        wires.sub[sub.handler] = p;
      });
    }

    /* ------------------------------------------------------------ animation */

    function wait(ms) {
      const id = runId;
      const total = ms / S.speed;
      return new Promise((resolve, reject) => {
        let elapsed = 0;
        let last = performance.now();
        function frame(now) {
          if (id !== runId) return reject(ABORT);
          if (S.paused) { last = now; requestAnimationFrame(frame); return; }
          elapsed += now - last;
          last = now;
          if (elapsed >= total) resolve();
          else requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });
    }

    function travel(pathEl, colour, opts) {
      opts = opts || {};
      const reverse = !!opts.reverse;
      const id = runId;

      return new Promise((resolve, reject) => {
        if (!pathEl) return resolve();
        const len = pathEl.getTotalLength();
        // longer wires take a little longer, so the motion reads as distance
        const dur = opts.dur != null
          ? opts.dur
          : Math.min(780, Math.max(360, 170 + len * 2.4));

        const trail = document.createElementNS(NS, "circle");
        trail.setAttribute("r", 17);
        trail.setAttribute("fill", colour);
        trail.setAttribute("opacity", ".22");
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("r", 7);
        dot.setAttribute("fill", colour);
        dot.setAttribute("stroke", "#f0eee6");
        dot.setAttribute("stroke-width", "2");
        gPulse.appendChild(trail);
        gPulse.appendChild(dot);

        const oldStroke = pathEl.getAttribute("stroke");
        pathEl.setAttribute("stroke", colour);
        pathEl.setAttribute("stroke-dasharray", "none");
        pathEl.setAttribute("opacity", ".8");

        let elapsed = 0;
        let last = performance.now();

        function cleanup() {
          trail.remove(); dot.remove();
          pathEl.setAttribute("stroke", oldStroke);
          pathEl.setAttribute("stroke-dasharray", "2 4");
          pathEl.setAttribute("opacity", "1");
        }

        function frame(now) {
          if (id !== runId) { cleanup(); return reject(ABORT); }
          if (S.paused) { last = now; requestAnimationFrame(frame); return; }
          elapsed += now - last; last = now;
          const p = Math.min(1, elapsed / (dur / S.speed));
          const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          const at = pathEl.getPointAtLength(reverse ? len * (1 - e) : len * e);
          dot.setAttribute("cx", at.x); dot.setAttribute("cy", at.y);
          trail.setAttribute("cx", at.x); trail.setAttribute("cy", at.y);
          if (p < 1) requestAnimationFrame(frame);
          else { cleanup(); resolve(); }
        }
        requestAnimationFrame(frame);
      });
    }

    function flashChip(type, handler) {
      const chip = document.getElementById(`chip-${type}-${handler}`);
      if (!chip) return;
      chip.classList.add("hot");
      setTimeout(() => chip.classList.remove("hot"), 750);
    }

    function flashCard(handler) {
      const card = document.getElementById("sub-" + handler);
      if (!card) return;
      card.classList.add("called");
      setTimeout(() => card.classList.remove("called"), 700);
    }

    function showEvent(ev, inst) {
      const slot = $("#slot");
      const kind = ev.type === "TaskAdded" ? EV.added : EV.done;
      const count = state.subs[ev.type].length;
      slot.className = "slot " + kind.cls;
      slot.innerHTML = `
    <div class="evhead">
      <span class="kick">EVENT</span>
      <span class="type">${ev.type}</span>
      <span class="count">${count} subscriber${count === 1 ? "" : "s"}</span>
    </div>
    <div class="evbody">${payload(ev)}</div>`;
      if (!inst) {
        slot.classList.remove("pop");
        void slot.offsetWidth;
        slot.classList.add("pop");
      }
    }

    function handlerMessage(handler, ev) {
      switch (handler) {
        case "log_event":
          return `${ev.stamp} ${ev.type} ${plainPayload(ev)}`;
        case "celebrate_added":
          return `New task queued: '${ev.title}' (priority ${ev.priority})`;
        case "award_points":
          return `+${10 + Math.floor(ev.minutes_spent / 5)} points for finishing '${ev.title}'`;
        case "record_analytics":
          return `recorded ${ev.minutes_spent} minutes on '${ev.title}'`;
        default:
          return "";
      }
    }

    const TAG = {
      log_event: "log",
      celebrate_added: "notify",
      award_points: "rewards",
      record_analytics: "analytics"
    };

    function callHandler(handler, ev) {
      state.runs[handler] = (state.runs[handler] || 0) + 1;
      const msg = handlerMessage(handler, ev);
      const card = document.getElementById("sub-" + handler);
      if (card) {
        const out = card.querySelector(".out");
        out.textContent = msg;
        out.classList.add("live");
        card.querySelector(".runs").textContent = "×" + state.runs[handler];
      }
      flashCard(handler);
      logLine(TAG[handler], msg);
    }

    /* ------------------------------------------------------------- publish */

    async function publish(ev, rowIndex, inst) {
      // 1. the publisher does its own work first
      state.activeRow = rowIndex;
      state.fired[rowIndex] = true;
      renderRows();
      if (!inst) await wait(240);

      // 2. the event travels to the bus
      if (!inst) await travel(wires.row[rowIndex], ev.colour);
      state.activeRow = -1;
      renderRows();

      // 3. the bus announces it
      state.event = ev;
      state.history.push(ev);
      showEvent(ev, inst);
      logLine("event", `EVENT  ${ev.type}  ${plainPayload(ev)}`);
      if (!inst) await wait(280);

      // 4. fan-out: one call per subscriber, in registration order
      const handlers = state.subs[ev.type].slice();
      for (const h of handlers) {
        if (!inst) {
          await travel(wires.sub[h], ev.colour);
          flashChip(ev.type, h);
        }
        callHandler(h, ev);
        if (!inst) await wait(120);
      }
    }

    /* --------------------------------------------------------------- scenes */

    const SCENES = [
      {
        name: "wiring",
        narration: "The composition root wires five subscriptions. The bus now maps each event class to the handlers that want it — and nothing has happened yet.",
        snippet: "bus.subscribe(TaskAdded, log_event)",
        async apply(inst) {
          for (const [type, handler] of WIRING) {
            state.subs[type].push(handler);
            renderRegistry();
            logLine("bus", `subscribed ${handler} -> ${type}`);
            if (!inst) {
              await travel(wires.sub[handler], "#8c877c", { reverse: true });
              await wait(110);
            }
          }
          renderRegistry();
        }
      },
      {
        name: "add",
        narration: "add_task() stores the task, then publishes TaskAdded. The publisher knows only the bus — two independent subscribers react.",
        snippet: "self._bus.publish(TaskAdded(title=title, priority=priority))",
        async apply(inst) {
          await publish(
            { type: "TaskAdded", title: "Write the report", priority: 2, stamp: nextStamp(), colour: EV.added.colour },
            0, inst
          );
        }
      },
      {
        name: "add2",
        narration: "The same call again: a different payload, the same two subscribers. A second task needed no new wiring and no new handler.",
        snippet: 'store.add_task("Water the plants")',
        async apply(inst) {
          await publish(
            { type: "TaskAdded", title: "Water the plants", priority: 1, stamp: nextStamp(), colour: EV.added.colour },
            1, inst
          );
        }
      },
      {
        name: "complete",
        narration: "complete_task() publishes TaskCompleted. Three independent subscribers react — each was written without knowing the other two exist.",
        snippet: 'store.complete_task("Write the report", minutes_spent=25)',
        async apply(inst) {
          await publish(
            { type: "TaskCompleted", title: "Write the report", minutes_spent: 25, stamp: nextStamp(), colour: EV.done.colour },
            2, inst
          );
        }
      },
      {
        name: "unsubscribe",
        narration: "subscribe() handed back an off switch. Calling it removes award_points from the fan-out — the publisher is not touched at all.",
        snippet: "stop_rewards()   # returned by bus.subscribe(...)",
        async apply(inst) {
          const handler = "award_points", type = "TaskCompleted";

          if (!inst) await travel(wires.sub[handler], "#b5493d", { reverse: true });

          state.subs[type] = state.subs[type].filter(h => h !== handler);
          state.removed.add(handler);

          if (!inst) {
            const chip = document.getElementById(`chip-${type}-${handler}`);
            if (chip) chip.classList.add("strike");
            logLine("bus", `unsubscribed ${handler} from ${type}`);
            await wait(380);
          } else {
            logLine("bus", `unsubscribed ${handler} from ${type}`);
          }
          renderRegistry();
          renderSubs();

          // the last announced event no longer has three listeners
          const count = $("#slot .count");
          if (count && state.event && state.event.type === "TaskCompleted") {
            const n = state.subs.TaskCompleted.length;
            count.textContent = `${n} subscriber${n === 1 ? "" : "s"}`;
          }
        }
      },
      {
        name: "complete2",
        narration: "The same publisher call, one fewer reaction. log_event and record_analytics still run; the rewards subscriber is simply gone.",
        snippet: 'store.complete_task("Water the plants", minutes_spent=5)',
        async apply(inst) {
          await publish(
            { type: "TaskCompleted", title: "Water the plants", minutes_spent: 5, stamp: nextStamp(), colour: EV.done.colour },
            3, inst
          );
        }
      },
      {
        name: "history",
        narration: "The bus keeps every event it saw. Events are plain data — you can audit them, replay them, or hand them to another process.",
        snippet: "bus.history   # every event, in order",
        async apply(inst) {
          $("#histOverlay").classList.add("open");
          renderHistory();
          if (!inst) {
            const rows = $("#histRows").querySelectorAll("tr");
            rows.forEach((r, i) => { r.style.animationDelay = (i * 55) + "ms"; });
            await wait(650);
          }
        }
      }
    ];

    /* ------------------------------------------------------- orchestration */

    function resetAll() {
      state = freshState();
      clock = 9 * 3600 + 41 * 60 + 2;
      gPulse.innerHTML = "";
      $("#conbody").innerHTML = "";
      $("#histOverlay").classList.remove("open");
      $("#histRows").innerHTML = "";
      const slot = $("#slot");
      slot.className = "slot";
      slot.innerHTML = '<div class="empty">awaiting event&hellip;</div>';
      SUBS.forEach(s => {
        const card = document.getElementById("sub-" + s.handler);
        card.classList.remove("off", "called");
        const out = card.querySelector(".out");
        out.textContent = "waiting for an event…";
        out.classList.remove("live");
        card.querySelector(".runs").textContent = "×0";
      });
      renderRows();
      renderRegistry();
      renderSubs();
      drawWires();
    }

    function setNarration(i) {
      const sc = SCENES[i];
      $("#stepno").textContent = String(i + 1).padStart(2, "0");
      $("#narrationText").textContent = sc.narration;
      $("#snippet").textContent = sc.snippet;
      $("#bar").style.width = ((i + 1) / SCENES.length * 100) + "%";
      [...$("#dots").children].forEach((d, k) => {
        d.classList.toggle("on", k === i);
        d.classList.toggle("done", k < i);
      });
      $("#btnBack").disabled = i === 0;
      $("#btnNext").disabled = i === SCENES.length - 1;
    }

    async function goTo(i, autoplay) {
      const my = ++runId;
      S.playing = !!autoplay;
      syncPlayButton();

      resetAll();
      setNarration(i);

      try {
        for (let k = 0; k < i; k++) await SCENES[k].apply(true);
        if (my !== runId) return;
        await SCENES[i].apply(false);
        if (my !== runId) return;

        if (autoplay && i < SCENES.length - 1) {
          await wait(900);
          if (my !== runId) return;
          goTo(i + 1, true);
          return;
        }
      } catch (err) {
        if (err === ABORT) return;
        throw err;
      }

      if (S.playing) {
        S.playing = false;
        syncPlayButton();
      }
    }

    function currentScene() {
      const dots = [...$("#dots").children];
      return Math.max(0, dots.findIndex(d => d.classList.contains("on")));
    }

    function syncPlayButton() {
      $("#btnPlay").textContent = S.playing ? "Pause" : "Play";
    }

    /* ------------------------------------------------------------- controls */

    function buildControls() {
      const dots = $("#dots");
      SCENES.forEach((sc, i) => {
        const b = document.createElement("button");
        b.title = `${String(i + 1).padStart(2, "0")} · ${sc.name}`;
        b.addEventListener("click", () => { S.paused = false; S.playing = false; goTo(i, false); });
        dots.appendChild(b);
      });

      $("#btnPlay").addEventListener("click", () => {
        if (S.playing) {                      // pause mid-run
          S.paused = true;
          S.playing = false;
          syncPlayButton();
          return;
        }
        if (S.paused) {                       // resume where we stopped
          S.paused = false;
          S.playing = true;
          syncPlayButton();
          return;
        }
        goTo(currentScene(), true);         // replay this scene, then carry on
      });

      $("#btnNext").addEventListener("click", () => {
        S.paused = false; S.playing = false;
        goTo(Math.min(SCENES.length - 1, currentScene() + 1), false);
      });

      $("#btnBack").addEventListener("click", () => {
        S.paused = false; S.playing = false;
        goTo(Math.max(0, currentScene() - 1), false);
      });

      $("#btnRestart").addEventListener("click", () => {
        S.paused = false; S.playing = false;
        goTo(0, true);
      });

      $("#speed").addEventListener("change", (e) => { S.speed = parseFloat(e.target.value); });
    }

    /* ----------------------------------------------------------------- fit */

    function fit() {
      // Fill the window width edge to edge; the design height becomes whatever
      // fits, so the page reads like a full-bleed slide instead of a card.
      K = window.innerWidth / DESIGN_W;
      const H = window.innerHeight / K;
      app.style.height = H + "px";
      app.style.transform = `scale(${K})`;

      // Short windows: give the stage back some of the room the chrome would eat,
      // but never shrink the chrome past legibility.
      const compact = Math.min(1, Math.max(0.8, H / DESIGN_H));
      const root = document.documentElement.style;
      root.setProperty("--barH", (58 * compact) + "px");
      root.setProperty("--conH", (96 * compact) + "px");
      root.setProperty("--narH", (92 * compact) + "px");
      stage.style.padding = `${14 * compact}px 18px ${12 * compact}px`;
      document.body.classList.toggle("tight", compact < 1);
      document.body.classList.toggle("vtight", compact < 0.85);

      drawWires();
    }

    /* ----------------------------------------------------------- bootstrap */

    function build() {
      buildControls();

      $("#subs").innerHTML = SUBS.map(s => `
    <article class="card sub" id="sub-${s.handler}" style="--bar:${s.colour}">
      <span class="port"></span>
      <div class="subhead">
        <span class="hname">${s.handler}</span>
        <span class="runs">×0</span>
      </div>
      <div class="listens">${s.listens.join(" · ")}</div>
      <div class="out">waiting for an event…</div>
    </article>`).join("");

      state = freshState();
      renderRows();
      renderRegistry();

      fit();
      window.addEventListener("resize", () => {
        clearTimeout(window.__rt);
        window.__rt = setTimeout(fit, 100);
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

      setNarration(0);
      setTimeout(() => goTo(0, true), 320);
    }

    build();
  </script>
</body>

</html>
